<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>Астро</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
:root {
  --bg: var(--tg-theme-bg-color, #14161d);
  --fg: var(--tg-theme-text-color, #eceef4);
  --muted: var(--tg-theme-hint-color, #8b90a0);
  --card: var(--tg-theme-secondary-bg-color, #1c1f29);
  --accent: var(--tg-theme-button-color, #7c8cff);
  --accent-fg: var(--tg-theme-button-text-color, #ffffff);
  --line: rgba(140,145,165,.35);
  --line: color-mix(in srgb, var(--fg) 22%, transparent);
  --fire: #ff7a59; --earth: #6fbf73; --air: #e8c547; --water: #5aa9ff;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--fg);
  font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
body { padding: 12px 14px 28px; max-width: 520px; margin: 0 auto; }

header { text-align: center; margin-bottom: 4px; }
#when { font-size: 18px; font-weight: 600; }
#moon { color: var(--muted); font-size: 13px; margin-top: 2px; }

#wheel { width: 100%; aspect-ratio: 1; margin: 6px 0 2px; }
#wheel svg { width: 100%; height: 100%; display: block; }
#wheel text { font-family: "Noto Sans Symbols", "Noto Sans Symbols 2", "Segoe UI Symbol", "DejaVu Sans", system-ui, sans-serif; }

.sector { stroke: none; }
.el-fire { fill: rgba(255,122,89,.14); fill: color-mix(in srgb, var(--fire) 14%, transparent); }
.el-earth { fill: rgba(111,191,115,.14); fill: color-mix(in srgb, var(--earth) 14%, transparent); }
.el-air { fill: rgba(232,197,71,.14); fill: color-mix(in srgb, var(--air) 14%, transparent); }
.el-water { fill: rgba(90,169,255,.14); fill: color-mix(in srgb, var(--water) 14%, transparent); }
text.sign { font-size: 17px; }
.el-fire-t { fill: var(--fire); } .el-earth-t { fill: var(--earth); }
.el-air-t { fill: var(--air); }   .el-water-t { fill: var(--water); }
.ring { fill: none; stroke: var(--line); stroke-width: 1; }
.ring.faint { stroke-dasharray: 2 4; }
.tick { stroke: var(--line); stroke-width: 1; }
.pmark { stroke: var(--fg); stroke-width: 1.4; }
.lead { stroke: var(--muted); stroke-width: .6; }
text.planet, text.retro, text.hnum { paint-order: stroke; stroke: var(--bg); stroke-width: 3px; stroke-linejoin: round; }
text.planet { font-size: 19px; fill: var(--fg); }
text.retro { font-size: 11px; font-weight: 700; fill: #ff5d8f; font-family: system-ui, sans-serif; }
text.hnum { font-size: 10px; fill: var(--muted); font-family: system-ui, sans-serif; }
text.angle { font-size: 9.5px; font-weight: 600; fill: var(--muted); font-family: system-ui, sans-serif; }
.hline { stroke: var(--line); stroke-width: .8; }
.hline.angular { stroke: var(--accent); stroke-width: 1.5; opacity: .85; }
.p-sun { fill: #ffc94d; } .p-moon { fill: #cfd6ea; }
.asp { stroke-width: 1.2; }
.asp-conj { stroke: var(--muted); }
.asp-sext { stroke: var(--water); }
.asp-tri { stroke: var(--earth); }
.asp-sq { stroke: var(--fire); }
.asp-opp { stroke: #ff5d8f; }

.time { background: var(--card); border-radius: 14px; padding: 12px 14px 10px; margin-top: 4px; }
.range { display: flex; gap: 6px; margin-bottom: 10px; }
.range button { flex: 1; border: 0; border-radius: 9px; padding: 7px 0; font: inherit; font-size: 13px;
  background: transparent; color: var(--muted); }
.range button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
input[type=range] { width: 100%; margin: 4px 0 8px; accent-color: var(--accent); height: 28px; }
.row { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 12px; }
#now { border: 1px solid var(--accent); color: var(--accent); background: transparent; border-radius: 9px;
  padding: 6px 14px; font: inherit; font-size: 13px; }

.place { background: var(--card); border-radius: 14px; padding: 12px 14px; margin-top: 10px; }
.place .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
#placeName { color: var(--muted); font-size: 13px; text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.btn { border: 1px solid var(--accent); color: var(--accent); background: transparent; border-radius: 9px;
  padding: 7px 12px; font: inherit; font-size: 13px; white-space: nowrap; }
.btn.fill { background: var(--accent); color: var(--accent-fg); }
.btn:disabled { opacity: .5; }
#placeForm { display: flex; gap: 8px; margin-top: 10px; }
#placeInput { flex: 1; min-width: 0; font: inherit; font-size: 14px; color: var(--fg); background: transparent;
  border: 1px solid var(--line); border-radius: 9px; padding: 7px 10px; }
#placeInput::placeholder { color: var(--muted); }
.seg { display: flex; gap: 6px; margin-top: 10px; }
.seg button { flex: 1; border: 0; border-radius: 9px; padding: 7px 0; font: inherit; font-size: 13px; background: transparent; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
#placeMsg { color: var(--muted); font-size: 12px; margin-top: 8px; min-height: 1em; }

#angles { text-align: center; color: var(--muted); font-size: 13px; margin: 2px 0 0; min-height: 1.4em; }
#list { margin: 14px 2px 0; padding: 0; list-style: none; }
#list li { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line);
  font-size: 14px; white-space: nowrap; }
#list .g { width: 1.4em; text-align: center; font-size: 17px; }
#list .n { color: var(--muted); }
#list .v { margin-left: auto; font-variant-numeric: tabular-nums; }
.rx { display: inline-block; font-size: 11px; font-weight: 700; line-height: 1; color: #ff5d8f;
  border: 1px solid #ff5d8f; border-radius: 5px; padding: 2px 4px; }
.hp { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 9px; padding: 1px 7px; }

h2 { font-size: 13px; font-weight: 600; color: var(--muted); margin: 18px 2px 0; text-transform: uppercase; letter-spacing: .04em; }
#cusps { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; margin: 4px 2px 0; padding: 0; list-style: none; }
#cusps li { display: flex; gap: 8px; padding: 5px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; }
#cusps .k { color: var(--muted); width: 1.6em; }
#cusps .v { margin-left: auto; font-variant-numeric: tabular-nums; }
/* аспекты */
.asp.minor { stroke: var(--muted); stroke-dasharray: 3 3; stroke-width: .8; }
.asp-ctl { margin-top: 8px; padding-top: 4px; padding-bottom: 12px; }
.ai { fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.t-conj { color: var(--fg); } .t-sext { color: var(--water); } .t-sq { color: var(--fire); }
.t-tri { color: var(--earth); } .t-opp { color: #ff5d8f; }
.t-semi, .t-semisq, .t-sesq, .t-quinc { color: var(--muted); }
.agrid { width: 100%; border-collapse: collapse; table-layout: fixed; margin-top: 12px; }
.agrid th { font-weight: 400; color: var(--muted); font-size: 15px; padding: 2px 0; text-align: center; }
.agrid th:first-child { width: 28px; }
.agrid .tx { font-size: 9.5px; font-weight: 600; font-family: system-ui, sans-serif; }
.agrid td { border: 1px solid var(--line); height: 38px; padding: 0; text-align: center; vertical-align: middle; line-height: 1; }
.agrid td.blank { border: 0; }
.agrid td .ai { width: 14px; height: 14px; display: block; margin: 0 auto 2px; }
.agrid td i { font-style: normal; font-size: 8.5px; color: var(--muted); display: block; }
#alist { margin: 12px 2px 0; padding: 0; list-style: none; }
#alist li { display: flex; align-items: center; gap: 6px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 14px; white-space: nowrap; }
#alist .pg { min-width: 1.3em; text-align: center; font-size: 17px; }
#alist .pg.tx { font-size: 11px; font-weight: 600; font-family: system-ui, sans-serif; color: var(--muted); }
#alist .ai { width: 17px; height: 17px; flex: none; }
#alist .n { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; }
#alist .v { margin-left: auto; font-variant-numeric: tabular-nums; }
.ap { font-size: 11px; border-radius: 9px; padding: 1px 7px; border: 1px solid var(--line); color: var(--muted); }
.ap.in { color: var(--earth); border-color: var(--earth); }
.btn.more { display: block; margin: 12px auto 0; }
#patterns { margin: 4px 2px 0; padding: 0; list-style: none; }
#patterns li { padding: 9px 0; border-bottom: 1px solid var(--line); }
#patterns .ttl { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-weight: 600; font-size: 14.5px; }
#patterns .mem { font-weight: 400; font-size: 17px; letter-spacing: .15em; white-space: nowrap; }
#patterns .hint { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
#patterns .none { color: var(--muted); font-size: 13.5px; }
.note { color: var(--muted); font-size: 11.5px; margin-top: 14px; text-align: center; }
</style>
</head>
<body>
  <header>
    <div id="when"></div>
    <div id="moon"></div>
    <div id="angles"></div>
  </header>

  <div id="wheel"></div>

  <section class="time">
    <div class="range" id="range">
      <button data-days="1" aria-pressed="false">±1 день</button>
      <button data-days="31" aria-pressed="false">±1 мес</button>
      <button data-days="366" aria-pressed="true">±1 год</button>
      <button data-days="3652" aria-pressed="false">±10 лет</button>
    </div>
    <input id="slider" type="range" min="0" max="1000" value="500" step="1" aria-label="Время">
    <div class="row"><span id="offset"></span><button id="now">Сейчас</button></div>
  </section>

  <section class="place">
    <div class="top">
      <button class="btn fill" id="geo" type="button">📍 Моё место</button>
      <span id="placeName">место не выбрано</span>
    </div>
    <form id="placeForm">
      <input id="placeInput" type="text" placeholder="Город или широта, долгота" enterkeyhint="search" autocomplete="off">
      <button class="btn" type="submit" id="placeGo">Найти</button>
    </form>
    <div class="seg" id="sys">
      <button type="button" data-sys="placidus" aria-pressed="true">Плацидус</button>
      <button type="button" data-sys="equal" aria-pressed="false">Равные дома</button>
    </div>
    <div id="placeMsg"></div>
  </section>

  <h2>Планеты</h2>
  <ul id="list"></ul>

  <h2 id="cuspsTitle" hidden>Дома</h2>
  <ul id="cusps" hidden></ul>

  <h2>Аспекты</h2>
  <section class="place asp-ctl">
    <div class="seg" id="aspMinor">
      <button type="button" data-v="0" aria-pressed="true">Основные</button>
      <button type="button" data-v="1" aria-pressed="false">+ минорные</button>
    </div>
    <div class="seg" id="aspOrb">
      <button type="button" data-v="0.6" aria-pressed="false">Узкий орбис</button>
      <button type="button" data-v="1" aria-pressed="true">Стандарт</button>
      <button type="button" data-v="1.3" aria-pressed="false">Широкий</button>
    </div>
  </section>
  <div id="grid"></div>
  <ul id="alist"></ul>
  <button class="btn more" id="aMore" type="button" hidden></button>

  <h2>Конфигурации</h2>
  <ul id="patterns"></ul>

  <p class="note">Положения геоцентрические, тропический зодиак.</p>

  <script>
/*
 * Лёгкая эфемерида без зависимостей: Солнце, Луна, планеты, Плутон, средний узел.
 * Основа — элементы орбит и поправки П. Шлайтера (Schlyter) + главные члены возмущений.
 * Точность: порядка угловых минут (Луна — до ~10′)
 * — для прототипа и ежедневной астрологии достаточно. Позже можно заменить на Swiss Ephemeris (WASM).
 * Эклиптическая долгота — средний equinox даты (тропический зодиак).
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.Ephemeris = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  const RAD = Math.PI / 180, DEG = 180 / Math.PI;
  const sind = (x) => Math.sin(x * RAD);
  const cosd = (x) => Math.cos(x * RAD);
  const norm = (x) => ((x % 360) + 360) % 360;
  // дни от 1999-12-31 00:00 UT (эпоха Шлайтера)
  const dayNumber = (date) => date.getTime() / 86400000 + 2440587.5 - 2451543.5;

  const EL = {
    sun:     (d) => ({ N: 0, i: 0, w: 282.9404 + 4.70935e-5 * d, a: 1, e: 0.016709 - 1.151e-9 * d, M: 356.0470 + 0.9856002585 * d }),
    moon:    (d) => ({ N: 125.1228 - 0.0529538083 * d, i: 5.1454, w: 318.0634 + 0.1643573223 * d, a: 60.2666, e: 0.0549, M: 115.3654 + 13.0649929509 * d }),
    mercury: (d) => ({ N: 48.3313 + 3.24587e-5 * d, i: 7.0047 + 5.0e-8 * d, w: 29.1241 + 1.01444e-5 * d, a: 0.387098, e: 0.205635 + 5.59e-10 * d, M: 168.6562 + 4.0923344368 * d }),
    venus:   (d) => ({ N: 76.6799 + 2.4659e-5 * d, i: 3.3946 + 2.75e-8 * d, w: 54.8910 + 1.38374e-5 * d, a: 0.72333, e: 0.006773 - 1.302e-9 * d, M: 48.0052 + 1.6021302244 * d }),
    mars:    (d) => ({ N: 49.5574 + 2.11081e-5 * d, i: 1.8497 - 1.78e-8 * d, w: 286.5016 + 2.92961e-5 * d, a: 1.523688, e: 0.093405 + 2.516e-9 * d, M: 18.6021 + 0.5240207766 * d }),
    jupiter: (d) => ({ N: 100.4542 + 2.76854e-5 * d, i: 1.303 - 1.557e-7 * d, w: 273.8777 + 1.64505e-5 * d, a: 5.20256, e: 0.048498 + 4.469e-9 * d, M: 19.895 + 0.0830853001 * d }),
    saturn:  (d) => ({ N: 113.6634 + 2.3898e-5 * d, i: 2.4886 - 1.081e-7 * d, w: 339.3939 + 2.97661e-5 * d, a: 9.55475, e: 0.055546 - 9.499e-9 * d, M: 316.967 + 0.0334442282 * d }),
    uranus:  (d) => ({ N: 74.0005 + 1.3978e-5 * d, i: 0.7733 + 1.9e-8 * d, w: 96.6612 + 3.0565e-5 * d, a: 19.18171 - 1.55e-8 * d, e: 0.047318 + 7.45e-9 * d, M: 142.5905 + 0.011725806 * d }),
    neptune: (d) => ({ N: 131.7806 + 3.0173e-5 * d, i: 1.77 - 2.55e-7 * d, w: 272.8461 - 6.027e-6 * d, a: 30.05826 + 3.313e-8 * d, e: 0.008606 + 2.15e-9 * d, M: 260.2471 + 0.005995147 * d }),
  };

  function kepler(Mdeg, e) {
    const M = norm(Mdeg) * RAD;
    let E = M + e * Math.sin(M) * (1 + e * Math.cos(M));
    for (let k = 0; k < 12; k++) {
      const dE = (E - e * Math.sin(E) - M) / (1 - e * Math.cos(E));
      E -= dE;
      if (Math.abs(dE) < 1e-12) break;
    }
    return E;
  }

  // положение по орбите → эклиптические x, y, z, r, lon, lat
  function orbit(el) {
    const E = kepler(el.M, el.e);
    const xv = el.a * (Math.cos(E) - el.e);
    const yv = el.a * Math.sqrt(1 - el.e * el.e) * Math.sin(E);
    const v = Math.atan2(yv, xv) * DEG;
    const r = Math.hypot(xv, yv);
    const vw = v + el.w;
    const x = r * (cosd(el.N) * cosd(vw) - sind(el.N) * sind(vw) * cosd(el.i));
    const y = r * (sind(el.N) * cosd(vw) + cosd(el.N) * sind(vw) * cosd(el.i));
    const z = r * (sind(vw) * sind(el.i));
    return fromXYZ(x, y, z);
  }

  function fromXYZ(x, y, z) {
    const r = Math.sqrt(x * x + y * y + z * z);
    return { x, y, z, r, lon: norm(Math.atan2(y, x) * DEG), lat: Math.asin(z / r) * DEG };
  }
  function fromPolar(lon, lat, r) {
    return fromXYZ(r * cosd(lat) * cosd(lon), r * cosd(lat) * sind(lon), r * sind(lat));
  }

  function sunPos(d) {
    const el = EL.sun(d);
    const E = kepler(el.M, el.e);
    const xv = Math.cos(E) - el.e;
    const yv = Math.sqrt(1 - el.e * el.e) * Math.sin(E);
    const lon = norm(Math.atan2(yv, xv) * DEG + el.w);
    const r = Math.hypot(xv, yv);
    return { lon, r, x: r * cosd(lon), y: r * sind(lon), M: el.M, w: el.w };
  }

  function moonPos(d, sun) {
    const el = EL.moon(d);
    let p = orbit(el);
    const Mm = el.M, Ms = sun.M;
    const Lm = el.N + el.w + el.M, Ls = sun.w + sun.M;
    const D = Lm - Ls, F = Lm - el.N;
    const dlon =
      -1.274 * sind(Mm - 2 * D) + 0.658 * sind(2 * D) - 0.186 * sind(Ms) - 0.059 * sind(2 * Mm - 2 * D) -
      0.057 * sind(Mm - 2 * D + Ms) + 0.053 * sind(Mm + 2 * D) + 0.046 * sind(2 * D - Ms) + 0.041 * sind(Mm - Ms) -
      0.035 * sind(D) - 0.031 * sind(Mm + Ms) - 0.015 * sind(2 * F - 2 * D) + 0.011 * sind(Mm - 4 * D);
    const dlat =
      -0.173 * sind(F - 2 * D) - 0.055 * sind(Mm - F - 2 * D) - 0.046 * sind(Mm + F - 2 * D) +
      0.033 * sind(F + 2 * D) + 0.017 * sind(2 * Mm + F);
    return { lon: norm(p.lon + dlon), lat: p.lat + dlat };
  }

  function plutoHelio(d) {
    const S = 50.03 + 0.033459652 * d, P = 238.95 + 0.003968789 * d;
    let lon = 238.9508 + 0.00400703 * d
      - 19.799 * sind(P) + 19.848 * cosd(P) + 0.897 * sind(2 * P) - 4.956 * cosd(2 * P)
      + 0.61 * sind(3 * P) + 1.211 * cosd(3 * P) - 0.341 * sind(4 * P) - 0.19 * cosd(4 * P)
      + 0.128 * sind(5 * P) - 0.034 * cosd(5 * P) - 0.038 * sind(6 * P) + 0.031 * cosd(6 * P)
      + 0.02 * sind(S - P) - 0.01 * cosd(S - P);
    const lat = -3.9082 - 5.453 * sind(P) - 14.975 * cosd(P) + 3.527 * sind(2 * P) + 1.673 * cosd(2 * P)
      - 1.051 * sind(3 * P) + 0.328 * cosd(3 * P) + 0.179 * sind(4 * P) - 0.292 * cosd(4 * P)
      + 0.019 * sind(5 * P) + 0.1 * cosd(5 * P) - 0.031 * sind(6 * P) - 0.026 * cosd(6 * P) + 0.011 * cosd(S - P);
    const r = 40.72 + 6.68 * sind(P) + 6.9 * cosd(P) - 1.18 * sind(2 * P) - 0.03 * cosd(2 * P)
      + 0.15 * sind(3 * P) - 0.14 * cosd(3 * P);
    lon += 3.82394e-5 * (d - 1.5); // прецессия J2000 → equinox даты
    return fromPolar(lon, lat, r);
  }

  function planetGeo(id, d, sun) {
    let h;
    if (id === 'pluto') {
      h = plutoHelio(d);
    } else {
      h = orbit(EL[id](d));
      let plon = 0, plat = 0;
      if (id === 'jupiter' || id === 'saturn' || id === 'uranus') {
        const Mj = EL.jupiter(d).M, Msa = EL.saturn(d).M, Mu = EL.uranus(d).M;
        if (id === 'jupiter') {
          plon = -0.332 * sind(2 * Mj - 5 * Msa - 67.6) - 0.056 * sind(2 * Mj - 2 * Msa + 21)
            + 0.042 * sind(3 * Mj - 5 * Msa + 21) - 0.036 * sind(Mj - 2 * Msa) + 0.022 * cosd(Mj - Msa)
            + 0.023 * sind(2 * Mj - 3 * Msa + 52) - 0.016 * sind(Mj - 5 * Msa - 69);
        } else if (id === 'saturn') {
          plon = 0.812 * sind(2 * Mj - 5 * Msa - 67.6) - 0.229 * cosd(2 * Mj - 4 * Msa - 2)
            + 0.119 * sind(Mj - 2 * Msa - 3) + 0.046 * sind(2 * Mj - 6 * Msa - 69) + 0.014 * sind(Mj - 3 * Msa + 32);
          plat = -0.02 * cosd(2 * Mj - 4 * Msa - 2) + 0.018 * sind(2 * Mj - 6 * Msa - 49);
        } else {
          plon = 0.04 * sind(Msa - 2 * Mu + 6) + 0.035 * sind(Msa - 3 * Mu + 33) - 0.015 * sind(Mj - Mu + 20);
        }
        h = fromPolar(h.lon + plon, h.lat + plat, h.r);
      }
    }
    // гелиоцентрическое → геоцентрическое (Земля = −Солнце)
    const g = fromXYZ(h.x + sun.x, h.y + sun.y, h.z);
    return { lon: g.lon, lat: g.lat };
  }

  const BODIES = [
    { id: 'sun', name: 'Солнце', glyph: '☉' },
    { id: 'moon', name: 'Луна', glyph: '☽' },
    { id: 'mercury', name: 'Меркурий', glyph: '☿' },
    { id: 'venus', name: 'Венера', glyph: '♀' },
    { id: 'mars', name: 'Марс', glyph: '♂' },
    { id: 'jupiter', name: 'Юпитер', glyph: '♃' },
    { id: 'saturn', name: 'Сатурн', glyph: '♄' },
    { id: 'uranus', name: 'Уран', glyph: '♅' },
    { id: 'neptune', name: 'Нептун', glyph: '♆' },
    { id: 'pluto', name: 'Плутон', glyph: '♇' },
    { id: 'node', name: 'Сев. узел', glyph: '☊' },
  ];

    { id: 'tri', name: 'Трин', angle: 120, orb: 7 },
    { id: 'opp', name: 'Оппозиция', angle: 180, orb: 8 },
    { id: 'semi', name: 'Полусекстиль', angle: 30, orb: 2, minor: true },
    { id: 'semisq', name: 'Полуквадрат', angle: 45, orb: 2.5, minor: true },
    { id: 'sesq', name: 'Полутораквадрат', angle: 135, orb: 2.5, minor: true },

  // Конфигурации (собственные, более жёсткие орбисы, не зависят от переключателей)
  function patterns(bodies) {
    const P = bodies.filter((b) => b.id !== 'node');
    const n = P.length;
    const ANG = { sext: 60, sq: 90, tri: 120, opp: 180, quinc: 150 };
    const LIM = { sext: 5, sq: 6, tri: 6, opp: 7, quinc: 3 };
    const has = (i, j, t) => Math.abs(sepAngle(P[i].lon, P[j].lon) - ANG[t]) <= LIM[t];
    const out = [], seen = new Set();
    const add = (id, idx, extra) => {
      const key = id + ':' + idx.slice().sort((x, y) => x - y).join(',');

      seen.add(key);

      add('stellium', g, { sign: signs.size === 1 ? SIGNS[[...signs][0]] : null });
    });

    const order = { grandcross: 0, grandtrine: 1, tsquare: 2, yod: 3, stellium: 4 };
    out.sort((x, y) => order[x.id] - order[y.id]);
    return out;
  }

  function moonPhase(date) {
    const d = dayNumber(date);
    const sun = sunPos(d);
    const elong = norm(moonPos(d, sun).lon - sun.lon);
    const illum = (1 - cosd(elong)) / 2;
    const names = ['Новолуние', 'Растущий серп', 'Первая четверть', 'Растущая Луна', 'Полнолуние', 'Убывающая Луна', 'Последняя четверть', 'Убывающий серп'];
    const glyphs = ['🌑', '🌒', '🌓', '🌔', '🌕', '🌖', '🌗', '🌘'];
    const k = Math.floor(((elong + 22.5) % 360) / 45);
    return { elong, illum, name: names[k], glyph: glyphs[k] };
  }

  const fmtDeg = (b) => `${b.deg}°${String(b.min).padStart(2, '0')}′`;

  // долгота → {знак, градусы, минуты} (для куспидов и углов)
  function describe(lon) {
    const signIndex = Math.floor(lon / 30), inSign = lon - signIndex * 30;
    return { lon, signIndex, sign: SIGNS[signIndex], deg: Math.floor(inSign), min: Math.floor((inSign % 1) * 60) };
  }

  // ---- Дома -------------------------------------------------------------
  // lat — широта (север +), lon — долгота (восток +), в градусах.
  function sidereal(date, lon) {
    const jd = date.getTime() / 86400000 + 2440587.5;
    const T = (jd - 2451545.0) / 36525;
    const gmst = 280.46061837 + 360.98564736629 * (jd - 2451545.0) + 0.000387933 * T * T - (T * T * T) / 38710000;
    return { ramc: norm(gmst + lon), eps: 23.439291 - 0.0130042 * T };

  const eclLon = (ra, eps) => norm(Math.atan2(sind(ra), cosd(ra) * cosd(eps)) * DEG);

  // куспид Плацидуса итерациями; which: 11, 12, 2, 3. null — если не сходится (полярные широты)
  function placidusCusp(ramc, eps, lat, which) {
    const tphi = Math.tan(lat * RAD), se = sind(eps);

    const upper = which === 11 || which === 12;

      const SAd = Math.acos(x) * DEG, SAn = 180 - SAd;
      const Rn = upper ? ramc + k * SAd : ramc + 180 - k * SAn;
      const done = Math.abs(Rn - R) < 1e-9;
      R = Rn;
      if (done) break;
    }
    return eclLon(R, eps);
  }

  // system: 'placidus' | 'equal'. Возвращает {asc, mc, cusps[12] (дома 1..12), system, fallback}
  function houses(date, lat, lon, system) {
    const { ramc, eps } = sidereal(date, lon);
    const mc = eclLon(ramc, eps);
    const asc = norm(Math.atan2(cosd(ramc), -(sind(ramc) * cosd(eps) + Math.tan(lat * RAD) * sind(eps))) * DEG);
    const ic = norm(mc + 180);
    let cusps = null, used = system, fallback = false;

    if (system === 'equal') {
      cusps = Array.from({ length: 12 }, (_, i) => norm(asc + 30 * i));
    } else {
      const c11 = placidusCusp(ramc, eps, lat, 11), c12 = placidusCusp(ramc, eps, lat, 12);
      const c2 = placidusCusp(ramc, eps, lat, 2), c3 = placidusCusp(ramc, eps, lat, 3);
      if ([c11, c12, c2, c3].every((c) => c !== null)) {
        cusps = [asc, c2, c3, ic, norm(c11 + 180), norm(c12 + 180), norm(asc + 180), norm(c2 + 180), norm(c3 + 180), mc, c11, c12];
      } else {
        // Порфирий: дуги между углами делятся на три части
        const a1 = norm(asc - mc), a2 = norm(ic - asc);
        const c11p = norm(mc + a1 / 3), c12p = norm(mc + (2 * a1) / 3);
        const c2p = norm(asc + a2 / 3), c3p = norm(asc + (2 * a2) / 3);
        cusps = [asc, c2p, c3p, ic, norm(c11p + 180), norm(c12p + 180), norm(asc + 180), norm(c2p + 180), norm(c3p + 180), mc, c11p, c12p];
        used = 'porphyry'; fallback = true;
      }
    }
    return { asc, mc, ic, dsc: norm(asc + 180), cusps, system: used, fallback };
  }

  // номер дома (1..12) для долготы
  function houseOf(lon, cusps) {
    for (let i = 0; i < 12; i++) {
      const a = cusps[i], b = cusps[(i + 1) % 12];
      const span = norm(b - a), off = norm(lon - a);
      if (off < span) return i + 1;
    }
    return 12;
  }

  return { positions, aspects, patterns, moonPhase, houses, houseOf, describe, SIGNS, BODIES, ASPECTS, fmtDeg, dayNumber };
});

  const store = {
    get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* ignore */ } },
  };

  // --- Состояние --------------------------------------------------------
  const DAY = 86400000;
  const $ = (id) => document.getElementById(id);
  const state = { spanDays: 366, live: true, when: new Date(), loc: null, system: 'placidus', minor: false, orbScale: 1, aspAll: false };
  const savedMinor = store.get('astro.minor');
  if (savedMinor === true || savedMinor === false) state.minor = savedMinor;
  const savedOrb = store.get('astro.orb');
  if ([0.6, 1, 1.3].includes(savedOrb)) state.orbScale = savedOrb;

  // значки аспектов (рисуем сами, чтобы не зависеть от шрифтов телефона)
  const ICON = {
    conj: '<circle cx="6" cy="10" r="3"/><path d="M8.4 7.6L13 3"/>',
    sext: '<path d="M8 2.5v11M3.2 5.2l9.6 5.6M12.8 5.2l-9.6 5.6"/>',
    sq: '<rect x="3" y="3" width="10" height="10"/>',
    tri: '<path d="M8 2.5L14 13H2z"/>',
    opp: '<circle cx="4.5" cy="11.5" r="2.5"/><circle cx="11.5" cy="4.5" r="2.5"/><path d="M6.3 9.7L9.7 6.3"/>',
    semi: '<path d="M3 3L8 13L13 3"/>',
    semisq: '<path d="M3 13.5H13M3 13.5L11 5.5"/>',
    sesq: '<rect x="3" y="6" width="8" height="8"/><path d="M11 6L14 3"/>',
    quinc: '<path d="M8 13.5V8M8 8L3 2.5M8 8L13 2.5"/>',
  };
  const icon = (id) => `<svg class="ai t-${id}" viewBox="0 0 16 16" aria-hidden="true">${ICON[id]}</svg>`;

  const savedLoc = store.get('astro.loc');
  if (savedLoc && Math.abs(savedLoc.lat) <= 90 && Math.abs(savedLoc.lon) <= 180) state.loc = savedLoc;
  const savedSys = store.get('astro.sys');
  if (savedSys === 'equal' || savedSys === 'placidus') state.system = savedSys;

  const fmtWhen = new Intl.DateTimeFormat('ru-RU', {
    day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit',
  });
  const pad = (n) => String(n).padStart(2, '0');
  const fmtLon = (lon) => {
    const d = Ephemeris.describe(lon);
    return `${d.deg}°${pad(d.min)}′ ${d.sign.glyph}︎`;
  };

  function offsetText(ms) {
    if (state.live) return 'сейчас';
    const sign = ms > 0 ? '+' : '−';
    const a = Math.abs(ms) / DAY;
    if (a < 1) return `${sign}${Math.round(a * 24)} ч`;
    if (a < 60) return `${sign}${a.toFixed(a < 10 ? 1 : 0)} дн`;
    if (a < 730) return `${sign}${Math.round(a / 30.44)} мес`;
    return `${sign}${(a / 365.25).toFixed(1)} лет`;
  }

  // --- Отрисовка --------------------------------------------------------
  function render() {
    const bodies = Ephemeris.positions(state.when);
    const L = state.loc;
    const H = L ? Ephemeris.houses(state.when, L.lat, L.lon, state.system) : null;
    if (H) bodies.forEach((b) => { b.house = Ephemeris.houseOf(b.lon, H.cusps); });
    const points = H
      ? [{ id: 'asc', name: 'Асцендент', glyph: 'AC', lon: H.asc, angle: true }, { id: 'mc', name: 'MC', glyph: 'MC', lon: H.mc, angle: true }]
      : [];
    const asp = Ephemeris.aspects(bodies, { minor: state.minor, scale: state.orbScale, points });

    $('wheel').innerHTML = Wheel.build(bodies, asp, H);
    $('when').textContent = fmtWhen.format(state.when);
    const m = Ephemeris.moonPhase(state.when);
    $('moon').textContent = `${m.glyph} ${m.name}, ${Math.round(m.illum * 100)}%`;
    $('offset').textContent = offsetText(state.when - Date.now());

    $('angles').textContent = H
      ? `ASC ${fmtLon(H.asc)} · MC ${fmtLon(H.mc)}` + (H.fallback ? ' · дома по Порфирию (полярная широта)' : '')
      : 'Укажите место — появятся дома, ASC и MC';

    $('list').innerHTML = bodies.map((b) =>
      `<li><span class="g">${b.glyph}︎</span><span class="n">${b.name}</span>` +
      (b.retro && b.id !== 'node' ? '<span class="rx" title="Ретроградная">R</span>' : '') +
      (H ? `<span class="hp">${b.house} дом</span>` : '') +
      `<span class="v">${Ephemeris.fmtDeg(b)} ${b.sign.glyph}︎</span></li>`
    ).join('');

    const showCusps = !!H;
    $('cuspsTitle').hidden = !showCusps;
    $('cusps').hidden = !showCusps;
    $('cusps').innerHTML = showCusps
      ? H.cusps.map((c, i) => `<li><span class="k">${i + 1}</span><span class="v">${fmtLon(c)}</span></li>`).join('')
      : '';

    renderAspects(bodies, asp, points);
  }

  // --- Аспекты ----------------------------------------------------------
  const lab = (p) => (p.angle ? p.glyph : p.glyph + '︎');
  const cls = (p) => (p.angle ? ' tx' : '');
  const fmtOrb = (o) => {
    const d = Math.floor(o), m = Math.round((o - d) * 60);
    return m === 60 ? `${d + 1}°00′` : `${d}°${pad(m)}′`;
  };
  const ELEM = { fire: 'огонь', earth: 'земля', air: 'воздух', water: 'вода' };
  const LIST_LIMIT = 12;

  function renderGrid(points, asp) {
    const map = new Map();
    asp.forEach((a) => map.set(a.a.id + '|' + a.b.id, a));
    const n = points.length;
    let html = '<table class="agrid"><tr><th></th>' +
      points.slice(0, n - 1).map((p) => `<th class="${cls(p).trim()}">${lab(p)}</th>`).join('') + '</tr>';
    for (let i = 1; i < n; i++) {
      html += `<tr><th class="${cls(points[i]).trim()}">${lab(points[i])}</th>`;
      for (let j = 0; j < n - 1; j++) {
        if (j >= i) { html += '<td class="blank"></td>'; continue; }
        const a = map.get(points[j].id + '|' + points[i].id);
        html += a
          ? `<td title="${a.type.name} ${fmtOrb(a.orb)}">${icon(a.type.id)}<i>${a.orb.toFixed(1)}°</i></td>`
          : '<td></td>';
      }
      html += '</tr>';
    }
    $('grid').innerHTML = html + '</table>';
  }

  function renderAspectList(asp) {
    const sorted = asp.slice().sort((x, y) => x.orb - y.orb);
    const shown = state.aspAll ? sorted : sorted.slice(0, LIST_LIMIT);
    $('alist').innerHTML = shown.length
      ? shown.map((a) =>
        `<li><span class="pg${cls(a.a)}">${lab(a.a)}</span>${icon(a.type.id)}<span class="pg${cls(a.b)}">${lab(a.b)}</span>` +
        `<span class="n">${a.type.name}</span><span class="v">${fmtOrb(a.orb)}</span>` +
        (a.applying === null ? '' : `<span class="ap${a.applying ? ' in' : ''}">${a.applying ? 'сближается' : 'расходится'}</span>`) +
        '</li>').join('')
      : '<li><span class="n">В заданном орбисе аспектов нет</span></li>';
    const more = $('aMore');
    more.hidden = sorted.length <= LIST_LIMIT;
    more.textContent = state.aspAll ? 'Свернуть' : `Показать все (${sorted.length})`;
  }

  function renderPatterns(bodies) {
    const list = Ephemeris.patterns(bodies);
    const apex = (p) => `${p.apex.glyph}︎ ${p.apex.name}`;
    const TEXT = {
      grandcross: () => ['Большой крест', 'Две оппозиции, образующие квадраты друг с другом'],
      grandtrine: (p) => ['Большой трин' + (p.element ? ` (${ELEM[p.element]})` : ''), 'Три планеты в трине друг к другу'],
      tsquare: (p) => ['Т-квадрат', `Оппозиция и вершина в квадратуре к обеим: ${apex(p)}`],
      yod: (p) => ['Йод', `Секстиль и вершина в квинконсе к обеим: ${apex(p)}`],
      stellium: (p) => ['Стеллиум', p.sign ? `Планет в знаке ${p.sign.name}: ${p.planets.length}` : `Планет в пределах 10°: ${p.planets.length}`],
    };
    $('patterns').innerHTML = list.length
      ? list.map((p) => {
        const [title, hint] = TEXT[p.id](p);
        return `<li><div class="ttl"><span>${title}</span><span class="mem">${p.planets.map((x) => x.glyph + '︎').join(' ')}</span></div><div class="hint">${hint}</div></li>`;
      }).join('')
      : '<li class="none">Крупных конфигураций сейчас нет</li>';
  }

  function renderAspects(bodies, asp, points) {
    const pts = bodies.filter((b) => b.id !== 'node').concat(points);
    renderGrid(pts, asp);
    renderAspectList(asp);
    renderPatterns(bodies);
  }

  function syncAsp() {
    document.querySelectorAll('#aspMinor button').forEach((b) => b.setAttribute('aria-pressed', String(Number(b.dataset.v) === (state.minor ? 1 : 0))));
    document.querySelectorAll('#aspOrb button').forEach((b) => b.setAttribute('aria-pressed', String(Number(b.dataset.v) === state.orbScale)));
  }

  $('aspMinor').addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    state.minor = btn.dataset.v === '1';
    store.set('astro.minor', state.minor);
    syncAsp();
    render();
  });

  $('aspOrb').addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    state.orbScale = Number(btn.dataset.v);
    store.set('astro.orb', state.orbScale);
    syncAsp();
    render();
  });

  $('aMore').addEventListener('click', () => { state.aspAll = !state.aspAll; render(); });

  // --- Время ------------------------------------------------------------
  function setFromSlider() {
    const v = Number($('slider').value);
    state.live = v === 500;
    state.when = new Date(Date.now() + ((v - 500) / 500) * state.spanDays * DAY);
    render();
  }

  $('slider').addEventListener('input', setFromSlider);

  $('range').addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    state.spanDays = Number(btn.dataset.days);
    document.querySelectorAll('#range button').forEach((b) => b.setAttribute('aria-pressed', String(b === btn)));
    setFromSlider();
  });

  $('now').addEventListener('click', () => {
    $('slider').value = 500;
    setFromSlider();
    if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
  });

  // «Сейчас» обновляется само, пока ползунок в центре
  setInterval(() => {
    if (state.live) { state.when = new Date(); render(); }
  }, 30000);

  // --- Место ------------------------------------------------------------
  const msg = (t) => { $('placeMsg').textContent = t || ''; };

  function setLoc(loc, note) {
    state.loc = loc;
    store.set('astro.loc', loc);
    $('placeName').textContent = loc ? loc.name : 'место не выбрано';
    msg(note);
    render();
  }

  function viaTelegram() {
    return new Promise((resolve) => {
      const lm = tg && tg.LocationManager;
      if (!lm) return resolve(null);
      const timer = setTimeout(() => resolve(null), 12000);
      const finish = (v) => { clearTimeout(timer); resolve(v); };
      try {
        lm.init(() => {
          if (!lm.isLocationAvailable) return finish(null);
          lm.getLocation((d) => {
            if (!d && lm.isAccessRequested && !lm.isAccessGranted) { try { lm.openSettings(); } catch (e) { /* ignore */ } }
            finish(d ? { lat: d.latitude, lon: d.longitude } : null);
          });
        });
      } catch (e) { finish(null); }
    });
  }

  function viaBrowser() {
    return new Promise((resolve) => {
      if (!navigator.geolocation) return resolve(null);
      navigator.geolocation.getCurrentPosition(
        (p) => resolve({ lat: p.coords.latitude, lon: p.coords.longitude }),
        () => resolve(null),
        { timeout: 10000, maximumAge: 600000 }
      );
    });
  }

  $('geo').addEventListener('click', async () => {
    $('geo').disabled = true;
    msg('Определяю место…');
    let p = await viaTelegram();
    if (!p) p = await viaBrowser();
    $('geo').disabled = false;
    if (p) setLoc({ lat: p.lat, lon: p.lon, name: `Моё место (${p.lat.toFixed(2)}, ${p.lon.toFixed(2)})` });
    else msg('Не удалось определить место. Разрешите доступ к геолокации или введите город / координаты ниже.');
  });

  $('placeForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const q = $('placeInput').value.trim();
    if (!q) return;
    const m = q.match(/^(-?\d+(?:[.,]\d+)?)\s*[,;\s]\s*(-?\d+(?:[.,]\d+)?)$/);
    if (m) {
      const lat = parseFloat(m[1].replace(',', '.')), lon = parseFloat(m[2].replace(',', '.'));
      if (Math.abs(lat) > 90 || Math.abs(lon) > 180) { msg('Широта от −90 до 90, долгота от −180 до 180.'); return; }
      setLoc({ lat, lon, name: `${lat.toFixed(2)}, ${lon.toFixed(2)}` });
      return;
    }
    $('placeGo').disabled = true;
    msg('Ищу…');
    try {
      const r = await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&accept-language=ru&q=' + encodeURIComponent(q));
      const j = await r.json();
      if (!j.length) msg('Место не найдено. Попробуйте иначе или введите координаты: 55.75, 37.62');
      else setLoc({ lat: parseFloat(j[0].lat), lon: parseFloat(j[0].lon), name: j[0].display_name.split(',')[0] });
    } catch (err) {
      msg('Не удалось найти город (нет связи). Введите координаты: 55.75, 37.62');
    }
    $('placeGo').disabled = false;
  });

  $('sys').addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    state.system = btn.dataset.sys;
    store.set('astro.sys', state.system);
    syncSys();
    render();
  });

  function syncSys() {
    document.querySelectorAll('#sys button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.sys === state.system)));
  }

  $('placeName').textContent = state.loc ? state.loc.name : 'место не выбрано';
  syncSys();
  syncAsp();
  render();
})();
</script>
</body>
</html>
